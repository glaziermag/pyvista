name: Build Documentation

# Reproduction branch on glaziermag/pyvista only. The parent "Build Documentation"
# run concludes `failure` without uploading the `pr-info` artifact, as upstream
# run 31118948998 did on 2026-08-06 when its "Save PR info" job failed. Every
# other workflow file is removed on this branch so only the `Deploy` child
# (netlify-deploy.yml, loaded from `main`) is exercised.

on:
  pull_request:

permissions: {}

jobs:
  pr-info:
    name: Save PR info
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p pr-info
          printf '%s' "$PR_NUMBER" > pr-info/pr_number.txt
          echo "repro: failing before the artifact upload"
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: pr-info
          path: pr-info/

